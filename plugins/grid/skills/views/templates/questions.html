<!doctype html>
<html lang="en" data-ob-theme="grid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{T-NN}} questions</title>
<link rel="stylesheet" href="../ds/tokens.css">
<link rel="stylesheet" href="../ds/components.css">
<link rel="stylesheet" href="../ds/views.css">
</head>
<body>
<header class="v-head">
  <span class="v-kicker">{{T-NN}} · {{project}} · questions</span>
  <h1>{{headline: for example "Two questions wait on Sam"}}</h1>
  <p class="v-meta">{{what the work cannot do until they are answered}}</p>
</header>

<!-- One row per open question from questions/<person>.md, with its id. -->
<section class="v-section" id="open">
  <h2>Open</h2>
  <ul class="v-list">
    <li class="v-row" data-state="waits" id="q-1">! <span class="v-mono">Q-1</span> to {{person}}: {{the question, complete}}</li>
  </ul>
</section>

<!-- Answered questions, newest last. Leave the section out when none are answered. -->
<section class="v-section" id="answered">
  <h2>Answered</h2>
  <ul class="v-list">
    <li class="v-row"><span class="v-mono">Q-2</span> {{person}}: {{the answer, in their words}}</li>
  </ul>
</section>
</body>
</html>
